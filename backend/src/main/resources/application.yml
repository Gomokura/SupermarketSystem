server:
  port: 8080

spring:
  application:
    name: supermarket-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # 使用 Oracle XE 实例
    url: jdbc:oracle:thin:@127.0.0.1:1521/XEPDB1
    username: system
    password: 123456
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-test-query: SELECT 1 FROM DUAL

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.supermarket.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    call-setters-on-nulls: true

jwt:
  # HS256 要求 secret >= 32 字节
  secret: supermarket-system-secret-key-2024-oracle-xe
  expiration: 86400000  # 24小时（毫秒）

logging:
  level:
    com.supermarket: debug
    com.baomidou: info
